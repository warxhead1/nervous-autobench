name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Core deps only — no GPU (moderngl/torch) or LLM extras. GPU-backed
      # tests skip themselves when no GL context is available; tests needing a
      # live LLM/bus/VM are marked `live` and excluded below.
      - name: Install
        run: pip install -e .[dev]

      - name: Run unit suite
        run: |
          python -m pytest -m "not live" \
            -p no:cacheprovider \
            --timeout=120 --timeout-method=thread \
            -q
